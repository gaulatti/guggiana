name: Test and Coverage

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.9"

      - name: Install dependencies
        run: npm ci

      - name: Validate frozen TTS bake-off and run offline tests
        run: |
          uv lock --check --project experiments/tts-bakeoff
          npm run test:tts-bakeoff

      - name: Validate local synthesis worker package and offline lifecycle
        run: |
          npm run test:local-synthesis-worker
          python -m compileall -q worker/local_synthesis worker/tests
          uv build --project worker

      - name: Build immutable local synthesis worker base image
        run: docker build --file worker/Dockerfile --tag guggiana-local-synthesis:test worker

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          use_oidc: true
